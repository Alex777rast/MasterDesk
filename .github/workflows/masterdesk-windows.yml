name: MasterDesk x64 signing preparation (unsigned)

# Manual only; never rebuild an old tag, publish a release or request signing.
on:
  workflow_dispatch:
    inputs:
      beta_number:
        description: "New builds: minimum 109 (106..108 reserved); artifact-only proof may select 108"
        required: true
        type: string
        default: "109"
      proof_run_id:
        description: "Optional: verify existing successful preparation artifacts only; do not rebuild"
        required: false
        type: string
        default: ""
      proof_source_commit:
        description: "Required for artifact-only proof: exact reviewed build commit (40 hex)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
concurrency:
  group: masterdesk-x64-preparation-${{ github.ref }}-${{ inputs.beta_number }}
  cancel-in-progress: false
env:
  RUST_TOOLCHAIN: "1.75.0"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  prepare:
    if: ${{ github.repository == 'Alex777rast/MasterDesk' && github.ref_type == 'branch' && inputs.proof_run_id == '' }}
    name: Build unsigned x64 evidence, without publication
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out the exact workflow commit and public submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Validate new beta and complete clean source
        shell: pwsh
        env:
          REQUESTED_BETA: ${{ inputs.beta_number }}
          PROOF_SOURCE_COMMIT: ${{ inputs.proof_source_commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROOF_SOURCE_COMMIT) { throw 'Artifact-only proof needs both proof inputs; no build started' }
          if ($env:REQUESTED_BETA -notmatch '^[1-9][0-9]{0,4}$') { throw 'Invalid beta input' }
          $beta = [int]$env:REQUESTED_BETA
          if ($beta -lt 109 -or $beta -gt 65535) { throw 'New builds require 109..65535; proof candidates106..108 are reserved' }
          $headers = @{Authorization="Bearer $env:GITHUB_TOKEN";'User-Agent'='MasterDesk-signing-preparation'}
          $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Alex777rast/MasterDesk/releases?per_page=100'
          foreach ($release in $releases) {
            if ($release.tag_name -match '^v1\.4\.9-masterdesk\.10-beta\.(\d+)$' -and $beta -le [int]$Matches[1]) {
              throw 'Beta must be newer than every release; old assets are immutable'
            }
          }
          "MASTERDESK_CANDIDATE_BETA=$beta" >> $env:GITHUB_ENV
          .\scripts\Test-MasterDeskSigningSource.ps1 -OutputPath artifacts/signing/source-gate.json

      - name: Set up Python
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter without an application build cache
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: false

      - name: Set up pinned vcpkg without restored binary caches
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: ${{ github.workspace }}\.tools\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Test metadata and policy helpers
        shell: pwsh
        run: |
          .\scripts\Test-MasterDeskSigningPreparation.ps1
          .\scripts\Test-DesktopDropWindowsPatch.ps1
          .\scripts\Test-DefaultsScope.ps1

      - name: Full x64 build with matching PE metadata
        shell: pwsh
        env:
          MASTERDESK_PYTHON: ${{ steps.python.outputs.python-path }}
          MASTERDESK_FLUTTER_ROOT: ${{ steps.flutter.outputs.CACHE-PATH }}
        run: |
          $env:MASTERDESK_LLVM_BIN = Split-Path (Get-Command clang.exe).Source
          .\scripts\Build-CustomWindows.ps1 -BetaNumber ([int]$env:MASTERDESK_CANDIDATE_BETA) -PrepareSigning

      - name: Test defaults and collect unsigned evidence
        shell: pwsh
        run: |
          $env:MASTERDESK_LLVM_BIN = Split-Path (Get-Command clang.exe).Source
          .\scripts\Test-CustomDefaults.ps1 -ClientOnly
          .\scripts\New-MasterDeskSigningInventory.ps1 -BetaNumber ([int]$env:MASTERDESK_CANDIDATE_BETA) -OutputDirectory artifacts/signing/evidence

      - name: Upload unsigned package and source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MasterDesk-x64-unsigned-beta-${{ inputs.beta_number }}-${{ github.sha }}
          path: |
            dist/MasterDesk-*-RDS-x86_64.exe
            artifacts/signing/source-gate.json
            artifacts/signing/evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned payload for Foundation configuration review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MasterDesk-x64-payload-beta-${{ inputs.beta_number }}-${{ github.sha }}
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  verify_existing:
    if: ${{ github.repository == 'Alex777rast/MasterDesk' && github.ref_type == 'branch' && inputs.proof_run_id != '' }}
    name: Verify existing unsigned artifacts without rebuilding
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out verification tools only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful reviewed preparation source
        shell: pwsh
        env:
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          PROOF_SOURCE_COMMIT: ${{ inputs.proof_source_commit }}
          PROOF_BETA: ${{ inputs.beta_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PROOF_RUN_ID -notmatch '^[1-9][0-9]{0,19}$' -or
              $env:PROOF_SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$' -or
              $env:PROOF_BETA -notmatch '^[1-9][0-9]{0,4}$' -or
              [int]$env:PROOF_BETA -lt 108 -or [int]$env:PROOF_BETA -gt 65535) { throw 'Invalid proof inputs' }
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";'User-Agent'='MasterDesk-artifact-proof'}
          $run=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/Alex777rast/MasterDesk/actions/runs/$env:PROOF_RUN_ID"
          if ($run.conclusion -cne 'success' -or $run.workflow_id -ne 323927768 -or
              $run.event -cne 'workflow_dispatch' -or $run.head_sha -cne $env:PROOF_SOURCE_COMMIT -or
              $run.head_branch -cne 'codex/x64-signing-source-20261106') { throw 'Run is not the successful reviewed preparation source' }
      - name: Download exact build artifacts with enforced archive digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run_id }}
          pattern: MasterDesk-x64-*-beta-${{ inputs.beta_number }}-${{ inputs.proof_source_commit }}
          path: artifacts/proof-input
          digest-mismatch: error
      - name: Check payload hashes, metadata and actual runner/core CLI
        shell: pwsh
        env:
          PROOF_SOURCE_COMMIT: ${{ inputs.proof_source_commit }}
          PROOF_BETA: ${{ inputs.beta_number }}
        run: |
          .\scripts\Test-HostedCliProof.ps1 -ArtifactRoot artifacts/proof-input -ExpectedCommit $env:PROOF_SOURCE_COMMIT -BetaNumber ([int]$env:PROOF_BETA) -OutputPath artifacts/proof-result/cli-proof.json
      - name: Upload proof report only, not a new EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MasterDesk-x64-cli-proof-${{ inputs.proof_run_id }}-${{ github.sha }}
          path: artifacts/proof-result/cli-proof.json
          if-no-files-found: error
          retention-days: 30

# A future reviewed payload-first/package-second signing flow needs Foundation
# approval, verified policies and a separate explicit maintainer decision.
